name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test
        run: |
          bash -n bin/frog-host-setup tests/run.sh
          ./tests/run.sh
      - name: Build auditable release
        run: |
          set -euo pipefail
          mkdir -p dist/frog-host-setup
          cp bin/frog-host-setup README.md LICENSE LICENSE-MIT LICENSE-APACHE dist/frog-host-setup/
          tar -C dist -czf "dist/frog-host-setup-${GITHUB_REF_NAME}.tar.gz" frog-host-setup
          cd dist
          sha256sum "frog-host-setup-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
          archive_sha=$(cut -d' ' -f1 SHA256SUMS)
          cat > frog-host-setup.spdx.json <<EOF
          {"spdxVersion":"SPDX-2.3","dataLicense":"CC0-1.0","SPDXID":"SPDXRef-DOCUMENT","name":"frog-host-setup-${GITHUB_REF_NAME}","documentNamespace":"https://github.com/${GITHUB_REPOSITORY}/releases/${GITHUB_REF_NAME}/spdx-${GITHUB_SHA}","creationInfo":{"created":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","creators":["Tool: frog-host-setup-release-workflow"]},"packages":[{"name":"frog-host-setup","SPDXID":"SPDXRef-Package","versionInfo":"${GITHUB_REF_NAME}","downloadLocation":"NOASSERTION","filesAnalyzed":false,"checksums":[{"algorithm":"SHA256","checksumValue":"${archive_sha}"}],"licenseConcluded":"Apache-2.0 OR MIT","licenseDeclared":"Apache-2.0 OR MIT","copyrightText":"Copyright 2026 Frog contributors"}]}
          EOF
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/frog-host-setup-*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/frog-host-setup-${GITHUB_REF_NAME}.tar.gz" \
            dist/SHA256SUMS \
            dist/frog-host-setup.spdx.json \
            --verify-tag --generate-notes --prerelease
